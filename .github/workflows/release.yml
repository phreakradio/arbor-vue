name: Release to npm

on:
  push:
    branches: [master]
  pull_request:
    types: [closed]
    branches: [master]

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '#release')
    name: Prepare patch release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out release request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and verify
        run: npm ci && npm run prepublishOnly
      - name: Create version-bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version --ignore-scripts
          version="$(node -p "require('./package.json').version")"
          node --input-type=module -e '
            const { name, version } = JSON.parse((await import("node:fs")).readFileSync("package.json", "utf8"));
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
            if (response.status === 200) throw new Error(`${name}@${version} is already published.`);
            if (response.status !== 404) throw new Error(`Could not check npm version availability: HTTP ${response.status}`);
          '
          branch="release/npm-v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json package-lock.json
          git commit -m "chore: prepare npm release v${version}"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore: release v${version}" \
            --body "Merge this pull request to publish version ${version} to npm."

  publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/npm-v')
    name: Publish merged release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check release version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_BRANCH" != "release/npm-v${version}" ]; then
            echo "Release branch does not match package version ${version}." >&2
            exit 1
          fi
      - name: Install dependencies and verify
        run: npm ci && npm run prepublishOnly
      - name: Publish package
        run: npm publish --ignore-scripts --registry=https://registry.npmjs.org/
